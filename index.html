<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Larry · retour vers ton écran</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0C0E3A; color: #FAFAFF;
         font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  a { color: #FFD650; font-weight: 700; }
  .ko { color: #ff8a9a; }
</style>
</head>
<body>
<main>
  <h1>🎵 Larry</h1>
  <p id="msg">Retour vers ton écran…</p>
  <p id="link"></p>
</main>
<script>
// Page relais pour la connexion Spotify de Larry (un petit écran sur ton réseau local).
// Spotify n'accepte de revenir que sur une adresse https : il revient ici, et cette page renvoie aussitôt
// le code à usage unique vers ton écran. Le code ne sert à rien sans la clé secrète gardée dans l'écran (PKCE).
// L'adresse de l'écran voyage dans « state » ; seules les adresses du réseau local sont acceptées.
(function () {
  var q = new URLSearchParams(location.search);
  var state = q.get('state') || '';
  var host = state.split('~')[0];
  var local = /^(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|[a-z0-9-]+\.local)(:\d{1,5})?$/i;
  var msg = document.getElementById('msg');
  if (!local.test(host)) {
    msg.className = 'ko';
    msg.textContent = "Adresse de l'écran inconnue : recommence depuis la page de Larry.";
    return;
  }
  var back = 'http://' + host + '/spotify/callback?' + new URLSearchParams({
    code: q.get('code') || '', state: state, error: q.get('error') || '' }).toString();
  document.getElementById('link').innerHTML = '';
  var a = document.createElement('a');
  a.href = back; a.textContent = 'Revenir sur Larry';
  document.getElementById('link').appendChild(a);
  location.replace(back);
})();
</script>
</body>
</html>
